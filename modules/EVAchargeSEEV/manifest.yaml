description: Driver module for chargebyte's EVAcharge SE platform (EV role)
config:
  kl02_gensio:
    description: The gensio string used for the connection to the KL02 co-processor.
    type: string
    default: serialdev,/dev/ttyAPP2,57600N81,local
provides:
  ev_board_support:
    interface: ev_board_support
    description: >-
      Provides the EVerest board support interface for this platform, i.e.
      low-level control/evaluation of control pilot, proximity pilot and contactor.
metadata:
